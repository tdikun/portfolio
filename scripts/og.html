<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG image</title>
<style>
  @font-face{font-family:"Inter";font-weight:400;src:url(../site/fonts/inter-400-normal.woff2) format("woff2")}
  @font-face{font-family:"Inter Tight";font-weight:600;src:url(../site/fonts/inter-tight-600-normal.woff2) format("woff2")}
  @font-face{font-family:"Newsreader";font-style:normal;font-weight:400;src:url(../site/fonts/newsreader-400-normal.woff2) format("woff2")}
  @font-face{font-family:"Newsreader";font-style:italic;font-weight:400;src:url(../site/fonts/newsreader-400-italic.woff2) format("woff2")}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden;background:#f6f4ef;color:#16151a}
  body{padding:100px 88px 0;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
  h1{font:600 104px/.98 "Inter Tight",sans-serif;letter-spacing:-.035em}
  .titles{font:italic 400 40px/1.25 Newsreader,serif;letter-spacing:-.005em;margin-top:22px}
  .titles span{color:#5d5a63}
  ul{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:64px;padding-top:36px;border-top:2px solid #dcd8cf}
  .n{display:block;font:400 80px/1 Newsreader,serif;letter-spacing:-.025em}
  .l{display:block;margin-top:12px;color:#5d5a63;font-size:19px;line-height:1.35;max-width:17ch}
</style>
</head>
<body>
  <h1>Tim Dikun</h1>
  <p class="titles">Co-founder of Reading.com. <span>COO of Teaching.com.</span></p>
  <ul>
    <li><span class="n">50x</span><span class="l">revenue growth</span></li>
    <li><span class="n">10M+</span><span class="l">students a year</span></li>
    <li><span class="n">Top 3</span><span class="l">grossing, App Store Kids</span></li>
    <li><span class="n">40</span><span class="l">people on the team</span></li>
  </ul>
</body>
</html>
